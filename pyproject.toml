[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "product-answer-checks"
version = "0.0.0"
description = "Checks on AI shopping answers against their product listings: what each check catches and what it costs"
readme = "README.md"
authors = [{ name = "Abdullah Memon", email = "abdullah@memonsystems.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The claim check under test: 0.3.0, whose code is the build test 1 ran on (verifier 66450a6).
dependencies = ["legal-rag-verifier>=0.3.0"]

[project.urls]
Repository = "https://github.com/azterizm/product-answer-checks"
Method = "https://github.com/azterizm/product-answer-checks/blob/main/docs/METHOD.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/product_answer_checks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "N",
    "S", "BLE", "A", "T20", "ISC", "PIE", "RET", "PTH", "TRY", "PERF", "FBT",
]
ignore = [
    "TRY003",   # contextual messages on raised exceptions are wanted
    "ISC001",   # conflicts with the formatter
    "RUF001",   # French listings use typographic quotes, dashes and no-break spaces
    "RUF002",   # docstrings cite METHOD sections with en dashes
    "S311",     # every random draw here is a seeded, published draw, not a secret
    "PLR0911", "PLR0912", "PLR0913",  # selection and offer rules read best as one function each
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "FBT"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["product_answer_checks", "legal_rag_verifier"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
exclude = ["^scripts/judge1b\\.py$", "^scripts/qwen27\\.py$"]  # runs under `uv run --with modal`

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
